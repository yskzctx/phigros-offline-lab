name: Assemble 173 release assets
on:
  push:
    branches: [fix/173-goals-perfect]
    paths: ['.github/release173-relay.json']
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify temporary chunks and upload the three release volumes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/assemble173.py
